# Сборка на Railway. Одна половина: Node для API, бота, очереди и
# рендера. Python больше не нужен — монтажный движок убран.

[phases.setup]
nixPkgs = [
  "nodejs_22",
  "ffmpeg-full",
  "chromium",
  "fontconfig",
  "freetype",
  # В голом контейнере нет ни одного системного шрифта. Если наш
  # собственный почему-то не подхватился, браузеру нечем рисовать
  # текст вовсе — и ролик выходит вообще без субтитров.
  "dejavu_fonts",
  "liberation_ttf",
  "noto-fonts",
]

# Remotion рисует кадр в настоящем браузере, а тот тянет за собой
# два десятка системных библиотек. Без них скачанный Chrome падает
# с «error while loading shared libraries» ещё до первого кадра.
nixLibs = [
  "glib",
  "nss",
  "nspr",
  "atk",
  "at-spi2-atk",
  "at-spi2-core",
  "cups",
  "dbus",
  "libdrm",
  "libxkbcommon",
  "mesa",
  "expat",
  "alsa-lib",
  "pango",
  "cairo",
  "libGL",
  "xorg.libX11",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXrandr",
  "xorg.libxcb",
]

[variables]
REMOTION_CHROME_EXECUTABLE = "/nix/var/nix/profiles/default/bin/chromium"
PUPPETEER_SKIP_DOWNLOAD = "1"

[phases.install]
cmds = [
  "npm ci --omit=dev || npm install --omit=dev",
]

[start]
cmd = "npm start"
